name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Optional dev extras if present
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || true; fi

      - name: Run pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    # Only run if frontend/package.json exists
    steps:
      - uses: actions/checkout@v4

      - name: Check for frontend
        id: check
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend (typecheck + vite build)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
